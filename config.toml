baseURL = "https://jduchniewicz.com"
title   = "Jakub Duchniewicz"

DefaultContentLanguage = "en"

theme = "hello-friend-ng"

PygmentsCodeFences = true
PygmentsStyle = "monokai"

rssLimit  = 10  # Maximum number of items in the RSS feed.
copyright = "This work is licensed under a Creative Commons Attribution-NonCommercial 4.0 International License." # This message is only used by the RSS template.

disqusShortname = "jduchniewicz-com"

archetypeDir = "archetypes"
contentDir   = "content"
dataDir      = "data"
layoutDir    = "layouts"
publishDir   = "public"

buildDrafts  = false
buildFuture  = false
buildExpired = false
canonifyURLs = true

enableRobotsTXT = true
enableGitInfo   = false
enableEmoji     = true
enableMissingTranslationPlaceholders = false
disableRSS     = false
disableSitemap = false
disable404     = false
disableHugoGeneratorInject = false

[permalinks]
  posts = "/posts/:year/:month/:title/"
  notes = "/notes/:year/:month/:title/"

[markup]
    defaultMarkdownHandler = "goldmark"
    [markup.goldmark]
        [markup.goldmark.renderer]
            unsafe = true

#[blackfriday]
#  hrefTargetBlank = true

[taxonomies]
  tag      = "tags"
  category = "categories"

[params]
  googleAnalytics = "G-P8QYB9KYCF"

  dateform        = "Jan 2, 2006"
  dateformShort   = "Jan 2"
  dateformNum     = "2006-01-02"
  dateformNumTime = "2006-01-02 15:04 -0700"

  # Metadata mostly used in document's head
  description = "Embedded systems, Rust, FPGA, telecom and game-tech notes by Jakub Duchniewicz"
  keywords = ""
  images = [""]

  homeSubtitle = "Embedded systems, Rust, FPGA, telecom and game-tech notes."

  # Prefix of link to the git commit detail page. GitInfo must be enabled.
  # gitUrl = ""

  # Set disableReadOtherPosts to true in order to hide the links to other posts.
  disableReadOtherPosts = false

  # Integrate Javascript files or stylesheets by adding the url to the external assets or by
  # linking local files with their path relative to the static folder, e.g. "css/styles.css"
  customCSS = ["/css/jk-site.css"]
  customJS  = []

  # Toggle this option need to rebuild SCSS, requires extended version of Hugo
  justifyContent = false  # Set "text-align: justify" to .content.

  # Directory name of your blog content (default is `content/posts`)
  contentTypeName = "posts"

  # Default theme "light" or "dark"
  defaultTheme = "dark"
  themeColorDark = "#252627"
  themeColorLight = "#fafafa"

  [params.author]
    name = "Jakub Duchniewicz"


  # Colors for favicons
  [params.favicon.color]
    maskDark = "#252627"
    maskLight = "#fafafa"
    msapplicationDark = "#252627"
    msapplicationLight = "#fafafa"
    themeDark = "#252627"
    themeLight = "#fafafa"

  [params.logo]
    logoText     = "jduchniewicz"
    logoHomeLink = "/"
    # Set true to remove the logo cursor entirely.
    # logoCursorDisabled = false
    # Set to a valid CSS color to change the cursor in the logo.
    logoCursorColor    = "#e6f2ff"
    # Set to a valid CSS time value to change the animation duration, "0s" to disable.
    logoCursorAnimate  = "1.2s"

  [[params.social]]
    name = "email"
    url  = "mailto:j.duchniewicz@gmail.com"

  [[params.social]]
    name = "github"
    url  = "https://github.com/JDuchniewicz"

  [[params.social]]
    name = "linkedin"
    url  = "https://www.linkedin.com/in/jduchnie"

  [[params.social]]
    name = "cv"
    url = "/cv/"

[languages]
  [languages.en.params]
    subtitle  = "Personal space"
    weight    = 1
    copyright = '<a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener">CC BY-NC 4.0</a>'

[menu]
  [[menu.main]]
    identifier = "projects"
    name       = "Projects"
    url        = "/projects/"
    weight     = 10

  [[menu.main]]
    identifier = "talks"
    name       = "Talks"
    url        = "/talks/"
    weight     = 20

  [[menu.main]]
    identifier = "posts"
    name       = "Writing"
    url        = "/posts/"
    weight     = 30

  [[menu.main]]
    identifier = "about"
    name       = "About"
    url        = "/about/"
    weight     = 40

  [[menu.main]]
    identifier = "cv"
    name       = "CV"
    url        = "/cv/"
    weight     = 50
